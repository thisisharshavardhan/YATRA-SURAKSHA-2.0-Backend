<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice Assistant Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        h1 { text-align: center; color: #667eea; margin-bottom: 10px; font-size: 2.2em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .status-bar {
            display: flex; justify-content: space-between; margin-bottom: 20px;
            padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 4px solid #667eea;
            flex-wrap: wrap; gap: 10px;
        }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%; background: #dc3545;
            animation: pulse 2s infinite;
        }
        .status-dot.ok { background: #28a745; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .config-section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .config-section h3 { color: #667eea; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; color: #333; font-weight: 500; font-size: 14px; }
        input, select {
            width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;
            font-size: 14px; transition: border-color 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .button-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        button {
            flex: 1; padding: 12px 20px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; min-width: 140px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover:not(:disabled) { background: #c82333; transform: translateY(-2px); }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover:not(:disabled) { background: #218838; transform: translateY(-2px); }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-warning:hover:not(:disabled) { background: #e0a800; }
        .recording-bar {
            display: none; align-items: center; justify-content: center; gap: 10px;
            padding: 12px; background: #fff3cd; border-radius: 10px; margin-bottom: 15px;
            border-left: 4px solid #ffc107;
        }
        .recording-bar.show { display: flex; }
        .rec-dot {
            width: 14px; height: 14px; background: #dc3545; border-radius: 50%;
            animation: recpulse 1s infinite;
        }
        @keyframes recpulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:0.6} }
        .transcript-box {
            background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 20px;
            max-height: 350px; overflow-y: auto;
        }
        .transcript-box h3 { color: #667eea; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 10px 15px; border-radius: 10px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .msg.user { background: #e3f2fd; border-left: 4px solid #2196f3; }
        .msg.assistant { background: #f3e5f5; border-left: 4px solid #9c27b0; }
        .msg.fn { background: #fff3cd; border-left: 4px solid #ffc107; font-size: 0.9em; }
        .msg.err { background: #ffebee; border-left: 4px solid #f44336; }
        .msg-header { font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .ts { font-size: 0.8em; color: #999; }
        .logs {
            background: #1e1e1e; color: #d4d4d4; border-radius: 10px; padding: 20px;
            max-height: 350px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px;
        }
        .logs h3 { color: #4ec9b0; margin-bottom: 15px; }
        .log { margin-bottom: 6px; padding: 3px 5px; border-radius: 3px; }
        .log.info { color: #4ec9b0; }
        .log.ok { color: #7ec699; }
        .log.warn { color: #dcdcaa; }
        .log.err { color: #f48771; }
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        .stat { background: #f8f9fa; padding: 12px; border-radius: 10px; text-align: center; border-left: 4px solid #667eea; }
        .stat-val { font-size: 1.8em; font-weight: bold; color: #667eea; }
        .stat-lbl { color: #666; font-size: 0.85em; margin-top: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎤 Gemini Voice Assistant Test</h1>
    <p class="subtitle">Real-time voice interaction with Google Gemini 2.5 Flash</p>

    <!-- Status -->
    <div class="status-bar">
        <div class="status-item"><span class="status-dot" id="sDot1"></span><span id="sTxt1">Socket: Disconnected</span></div>
        <div class="status-item"><span class="status-dot" id="sDot2"></span><span id="sTxt2">Gemini: Off</span></div>
        <div class="status-item"><span id="sTxt3">No session</span></div>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat"><div class="stat-val" id="cSent">0</div><div class="stat-lbl">Audio Chunks Sent</div></div>
        <div class="stat"><div class="stat-val" id="cRecv">0</div><div class="stat-lbl">Audio Chunks Recv</div></div>
        <div class="stat"><div class="stat-val" id="cFn">0</div><div class="stat-lbl">Function Calls</div></div>
    </div>

    <!-- Config -->
    <div class="config-section">
        <h3>⚙️ Configuration</h3>
        <div class="form-group">
            <label>Server URL:</label>
            <input type="text" id="serverUrl" value="http://localhost:3000">
        </div>
        <div class="form-group">
            <label>Auth Token:</label>
            <input type="text" id="authToken" placeholder="Paste your JWT token here">
        </div>
        <div class="form-group">
            <label>Location (lat, lng):</label>
            <input type="text" id="location" value="12.9716, 77.5946" placeholder="12.9716, 77.5946">
        </div>
    </div>

    <!-- Controls -->
    <div class="button-group">
        <button class="btn-primary" id="btnConn" onclick="doConnect()">Connect Socket</button>
        <button class="btn-danger" id="btnDisc" onclick="doDisconnect()" disabled>Disconnect</button>
        <button class="btn-success" id="btnStart" onclick="doStartGemini()" disabled>Start Gemini</button>
        <button class="btn-danger" id="btnStop" onclick="doStopGemini()" disabled>Stop Gemini</button>
    </div>
    <div class="button-group">
        <button class="btn-warning" id="btnRec" onclick="doStartRec()" disabled>🎤 Start Recording</button>
        <button class="btn-danger" id="btnRecStop" onclick="doStopRec()" disabled>⏹️ Stop Recording</button>
        <button class="btn-primary" id="btnTxt" onclick="doSendText()" disabled>📝 Send Text</button>
    </div>

    <!-- Recording indicator -->
    <div class="recording-bar" id="recBar"><div class="rec-dot"></div><span>Recording... speak now</span></div>

    <!-- Transcripts -->
    <div class="transcript-box">
        <h3>💬 Conversation</h3>
        <div id="convo"><p style="color:#999;text-align:center">Conversation will appear here...</p></div>
    </div>

    <!-- Logs -->
    <div class="logs">
        <h3>📋 System Logs</h3>
        <div id="logBox"></div>
    </div>
</div>

<script>
    // ── State ──
    let socket = null;
    let audioCtx = null;
    let mediaStream = null;
    let scriptNode = null;
    let sourceNode = null;
    let isRecording = false;
    let audioQueue = [];
    let isPlaying = false;
    let chunksSent = 0, chunksRecv = 0, fnCalls = 0;

    // ── Logging ──
    function log(msg, type = 'info') {
        const box = document.getElementById('logBox');
        const d = document.createElement('div');
        d.className = `log ${type}`;
        d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        console.log(`[${type.toUpperCase()}]`, msg);
    }

    function addMsg(type, text, meta) {
        const box = document.getElementById('convo');
        if (box.querySelector('p[style]')) box.innerHTML = '';
        const icons = { user: '👤 You', assistant: '🤖 Gemini', fn: '⚙️ Function', err: '❌ Error' };
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerHTML = `<div class="msg-header"><span>${icons[type] || type}</span><span class="ts">${new Date().toLocaleTimeString()}</span></div><div>${text}</div>`;
        if (meta) d.innerHTML += `<div style="font-size:0.85em;color:#666;margin-top:4px;white-space:pre-wrap">${meta}</div>`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }

    function updateStats() {
        document.getElementById('cSent').textContent = chunksSent;
        document.getElementById('cRecv').textContent = chunksRecv;
        document.getElementById('cFn').textContent = fnCalls;
    }

    // ── UI helpers ──
    function setSocketUI(connected) {
        document.getElementById('sDot1').classList.toggle('ok', connected);
        document.getElementById('sTxt1').textContent = connected ? 'Socket: Connected' : 'Socket: Disconnected';
        document.getElementById('btnConn').disabled = connected;
        document.getElementById('btnDisc').disabled = !connected;
        document.getElementById('btnStart').disabled = !connected;
        if (!connected) setGeminiUI(false);
    }

    function setGeminiUI(connected) {
        document.getElementById('sDot2').classList.toggle('ok', connected);
        document.getElementById('sTxt2').textContent = connected ? 'Gemini: Connected' : 'Gemini: Off';
        document.getElementById('sTxt3').textContent = connected ? 'Session active' : 'No session';
        document.getElementById('btnStart').disabled = connected;
        document.getElementById('btnStop').disabled = !connected;
        document.getElementById('btnRec').disabled = !connected;
        document.getElementById('btnTxt').disabled = !connected;
        if (!connected) {
            document.getElementById('btnRecStop').disabled = true;
            document.getElementById('recBar').classList.remove('show');
        }
    }

    // ── Socket connection ──
    function doConnect() {
        const url = document.getElementById('serverUrl').value.trim();
        const token = document.getElementById('authToken').value.trim();
        if (!token) { log('Auth token is required!', 'err'); return; }

        log('Connecting to socket server...');
        log('Token length: ' + token.length + ' chars', 'info');

        socket = io(`${url}/user`, {
            query: { token },
            auth: { token },
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 5,
            timeout: 10000
        });

        socket.on('connect', () => { log('✅ Socket connected (id: ' + socket.id + ')', 'ok'); setSocketUI(true); });
        socket.on('disconnect', (reason) => { log('❌ Socket disconnected: ' + reason, 'err'); setSocketUI(false); });
        socket.on('connect_error', (err) => { log('Socket connect_error: ' + err.message, 'err'); });
        socket.on('error', (err) => { log('Socket error: ' + (err.message || JSON.stringify(err)), 'err'); });

        // ── Gemini events ──
        socket.on('gemini:connected', (d) => {
            log('✅ Gemini AI connected', 'ok');
            setGeminiUI(true);
            addMsg('assistant', 'Gemini voice assistant is ready! Start speaking or send text.');
        });
        socket.on('gemini:session-created', (d) => { log('Session created: ' + (d.sessionId || ''), 'ok'); });
        socket.on('gemini:disconnected', (d) => {
            log('Gemini disconnected: ' + (d.message || ''), 'warn');
            setGeminiUI(false);
        });
        socket.on('gemini:audio-delta', (d) => {
            chunksRecv++; updateStats();
            queueAudio(d.audio);
        });
        socket.on('gemini:audio-done', () => { log('Audio response done', 'ok'); });
        socket.on('gemini:text-response', (d) => {
            log('Text response: ' + d.text, 'ok');
            addMsg('assistant', d.text);
        });
        socket.on('gemini:transcript-delta', (d) => { log('Transcript delta: ' + d.delta, 'info'); });
        socket.on('gemini:transcript-done', (d) => {
            if (d.transcript) {
                log('AI transcript: ' + d.transcript, 'ok');
                addMsg('assistant', d.transcript);
            }
        });
        socket.on('gemini:user-transcript', (d) => {
            log('You said: ' + d.transcript, 'info');
            addMsg('user', d.transcript);
        });
        socket.on('gemini:speech-started', () => { log('Speech interrupted', 'info'); });
        socket.on('gemini:function-calling', (d) => { fnCalls++; updateStats(); log('Calling: ' + d.function, 'warn'); addMsg('fn', 'Calling: ' + d.function); });
        socket.on('gemini:function-executing', (d) => { log('Executing: ' + d.function, 'warn'); addMsg('fn', 'Executing: ' + d.function, JSON.stringify(d.args, null, 2)); });
        socket.on('gemini:function-result', (d) => { log('Result: ' + d.function, 'ok'); addMsg('fn', 'Result from ' + d.function, JSON.stringify(d.result, null, 2)); });
        socket.on('gemini:sos-confirmed', (d) => { log('🚨 SOS confirmed: ' + d.alertId, 'err'); addMsg('err', 'SOS Alert Triggered! ID: ' + d.alertId); });
        socket.on('gemini:sos-error', (d) => { log('SOS error: ' + d.message, 'err'); addMsg('err', 'SOS Error: ' + d.message); });
        socket.on('gemini:error', (d) => { log('Gemini error: ' + d.message + (d.code ? ' [' + d.code + ']' : ''), 'err'); addMsg('err', d.message); });
        socket.on('gemini:text-sent', () => { log('Text sent', 'ok'); });
        socket.on('gemini:location-updated', () => { log('Location updated', 'ok'); });
    }

    function doDisconnect() {
        if (isRecording) doStopRec();
        if (socket) { socket.disconnect(); socket = null; }
        setSocketUI(false);
    }

    // ── Gemini session ──
    function doStartGemini() {
        const loc = document.getElementById('location').value.split(',').map(s => parseFloat(s.trim()));
        if (loc.length !== 2 || isNaN(loc[0]) || isNaN(loc[1])) { log('Invalid location! Use: lat, lng', 'err'); return; }
        log('Starting Gemini session...');
        socket.emit('gemini:connect', { latitude: loc[0], longitude: loc[1], settings: { voice: 'Aoede' } });
    }

    function doStopGemini() {
        if (isRecording) doStopRec();
        log('Stopping Gemini session...');
        socket.emit('gemini:disconnect');
    }

    // ── Audio Recording (PCM16 16kHz mono → base64) ──
    async function doStartRec() {
        try {
            // Gemini Live API expects 16kHz PCM16 mono
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
            });
            log('Microphone access granted (16kHz)', 'ok');

            sourceNode = audioCtx.createMediaStreamSource(mediaStream);

            // ScriptProcessorNode for raw PCM access (4096 samples per buffer)
            scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
            scriptNode.onaudioprocess = (e) => {
                if (!isRecording) return;
                const float32 = e.inputBuffer.getChannelData(0);
                // Convert Float32 to Int16 (PCM16)
                const int16 = new Int16Array(float32.length);
                for (let i = 0; i < float32.length; i++) {
                    const s = Math.max(-1, Math.min(1, float32[i]));
                    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                // Convert to base64
                const bytes = new Uint8Array(int16.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                const b64 = btoa(binary);

                // Send audio chunk to server
                socket.emit('gemini:audio', { audio: b64 });
                chunksSent++; updateStats();
            };

            sourceNode.connect(scriptNode);
            scriptNode.connect(audioCtx.destination);
            isRecording = true;

            document.getElementById('recBar').classList.add('show');
            document.getElementById('btnRec').disabled = true;
            document.getElementById('btnRecStop').disabled = false;
            log('🎤 Recording started (streaming PCM16 16kHz)', 'ok');

        } catch (err) {
            log('Mic error: ' + err.message, 'err');
            addMsg('err', 'Failed to start recording: ' + err.message);
        }
    }

    function doStopRec() {
        isRecording = false;
        if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
        if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        if (audioCtx) { audioCtx.close(); audioCtx = null; }

        // Tell server we're done speaking
        if (socket && socket.connected) {
            socket.emit('gemini:audio-commit');
            log('Audio committed (end of speech)', 'ok');
        }

        document.getElementById('recBar').classList.remove('show');
        document.getElementById('btnRec').disabled = false;
        document.getElementById('btnRecStop').disabled = true;
        log('🎤 Recording stopped', 'ok');
    }

    // ── Audio Playback (PCM16 base64 → speaker) ──
    // Queue-based to avoid overlapping chunks
    function queueAudio(b64) {
        audioQueue.push(b64);
        if (!isPlaying) playNext();
    }

    async function playNext() {
        if (audioQueue.length === 0) { isPlaying = false; return; }
        isPlaying = true;
        const b64 = audioQueue.shift();
        try {
            // Gemini returns audio/pcm at 24kHz by default in audio responses
            const playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            const raw = atob(b64);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

            const int16 = new Int16Array(bytes.buffer);
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / (int16[i] < 0 ? 0x8000 : 0x7FFF);
            }

            const buf = playCtx.createBuffer(1, float32.length, 24000);
            buf.getChannelData(0).set(float32);
            const src = playCtx.createBufferSource();
            src.buffer = buf;
            src.connect(playCtx.destination);
            src.onended = () => { playCtx.close(); playNext(); };
            src.start();
        } catch (err) {
            log('Playback error: ' + err.message, 'err');
            playNext();
        }
    }

    // ── Send Text ──
    function doSendText() {
        const text = prompt('Enter your message:');
        if (text && text.trim()) {
            socket.emit('gemini:text', { text: text.trim() });
            addMsg('user', text.trim());
            log('Sent text: ' + text.trim(), 'info');
        }
    }

    // ── Init ──
    log('🚀 Gemini Voice Assistant Test Ready', 'ok');
    log('1. Paste your Auth Token → 2. Connect Socket → 3. Start Gemini → 4. Record or Send Text', 'info');
</script>
</body>
</html>
